name: Update profile art
on:
  schedule:
    - cron: "7 3,15 * * *"   # twice a day
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/profile_art.py
      - .github/workflows/candles.yml
permissions:
  contents: write
jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draw chart, ticker and status board
        env:
          GH_TOKEN: ${{ secrets.PROFILE_PAT }}   # personal access token with read:user (counts private contributions)
          GH_LOGIN: sarthakk-1126
        run: python3 scripts/profile_art.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet || (git commit -m "Update profile art" && git pull --rebase && git push)
