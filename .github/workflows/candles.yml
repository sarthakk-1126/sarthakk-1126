name: Update commit candlestick chart
on:
  schedule:
    - cron: "17 2 * * *"   # daily
  workflow_dispatch:
permissions:
  contents: write
jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draw chart
        env:
          GH_TOKEN: ${{ secrets.PROFILE_PAT }}   # personal access token with read:user (counts private contributions)
          GH_LOGIN: sarthakk-1126
        run: python3 scripts/candles.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/commit-candles.svg
          git diff --cached --quiet || (git commit -m "Update commit candlestick chart" && git push)
